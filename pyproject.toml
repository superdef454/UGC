[project]
name = "ugc-quizzes"
version = "0.1.0"
description = "Пользовательские опросы: создание, прохождение, статистика"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "DJ", "RUF", "ANN", "D", "PTH"]
ignore = [
    "D100", "D102", "D104", "D105", "D106", "D107",
    "ANN401",
    # кириллица в строках - не опечатка
    "RUF001", "RUF002", "RUF003",
    # Meta, fields, permission_classes и т.п. в Django/DRF
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]
"**/management/commands/*" = ["D101"]
"**/admin.py" = ["D101"]
"**/serializers.py" = ["D101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["migrations/", "tests/", ".venv/"]

[[tool.mypy.overrides]]
module = ["adrf.*", "uvicorn_worker.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"
