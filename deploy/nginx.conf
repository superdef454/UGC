upstream app {
    server web:8000;
}

server {
    listen 80;
    client_max_body_size 1m;

    location /static/ {
        alias /static/;
        expires 7d;
    }

    location / {
        proxy_pass http://app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
