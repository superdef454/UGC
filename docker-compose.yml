x-app: &app
  build: .
  environment:
    DJANGO_DEBUG: "0"
    DJANGO_SECRET_KEY: change-me-in-prod
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:${APP_PORT:-8080},http://127.0.0.1:${APP_PORT:-8080}
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    # для демо: чтобы в swagger можно было представиться через X-User-Id
    HEADER_AUTH_ENABLED: "1"
    WEB_CONCURRENCY: "4"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ugc
      POSTGRES_USER: ugc
      POSTGRES_PASSWORD: ugc
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ugc -d ugc"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - static:/app/staticfiles

  stats-worker:
    <<: *app
    command: python manage.py process_statistics
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static:ro
    depends_on:
      - web

volumes:
  pgdata:
  static:
