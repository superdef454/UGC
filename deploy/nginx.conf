server {
    listen 80;
    client_max_body_size 1m;

    # DNS докера. Адрес web резолвится на каждый запрос (с кэшем на 10 с), а не один
    # раз при старте: иначе после пересоздания контейнера web nginx стучится в старый IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://web:8000;

    location /static/ {
        alias /static/;
        expires 7d;
    }

    location / {
        proxy_pass $app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
